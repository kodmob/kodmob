<section class="container-site section-sm pb-20">
  <div class="cta-band reveal flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h2 class="h2"><span data-km-field="title">{{title}}</span>{{#titleAccent}}<br><span class="cta-accent" data-km-field="titleAccent">{{titleAccent}}</span>{{/titleAccent}}</h2>
{{#lead}}
      <p class="mt-2 text-white/80" data-km-field="lead">{{lead}}</p>
{{/lead}}
    </div>
    <div class="flex flex-col gap-3 sm:flex-row">
{{#button}}{{#url}}
      <a href="{{url}}" class="btn btn-white btn-lg"><span data-km-field="button">{{button}}</span> <svg class="icon icon-arrow" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
{{/url}}{{/button}}
{{#secondary}}{{#secondaryUrl}}
      <a href="{{secondaryUrl}}" class="btn btn-glass btn-lg" data-km-field="secondary">{{secondary}}</a>
{{/secondaryUrl}}{{/secondary}}
    </div>
  </div>
</section>
